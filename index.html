    <link href="CSS/style.css" rel="stylesheet" />

  <body>
    <header>
      <h1>사이트 제목</h1>

      </div>

      <div class="calendar-content">
        <h2 class="main">메인 콘텐츠</h2>
        <div id="month"></div>
        <div id="calendar"></div>
        <script src="JS/script.js"></script>
        <script>
          try {
            if (
              typeof printMonth === "function" &&
              typeof printfCalendar === "function"
            ) {
              printMonth();
              printfCalendar();
            } else {
              console.error("달력 함수가 로드되지 않았습니다.");
            }
          } catch (e) {
            console.error("달력 생성 중 오류:", e.message);
          }
        </script>
      </div>

      <div>
        <h2 class="right-side">우측 사이드</h2>
        <div class="clock">시계</div>
        <div class="Todo">To-do list</div>
        <div class="other-site">관련 사이트 바로가기</div>
      </div>
    </div>
